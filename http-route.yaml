apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1
  namespace: roboshop
spec:
  parentRefs:
    - name: roboshop
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /0
      backendRefs:
        - name: app1
          port: 80
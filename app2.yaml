apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: app2
        image: pavan667799/roboshop:nginxv1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: roboshop
spec:
  type: NodePort

  selector:
    app: app1

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---